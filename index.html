<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masahiro Suzuki</title>
  <meta name="description" content="Academic website of Masahiro Suzuki.">
  <style>
    :root{--text:#20262d;--muted:#65717c;--line:#e2e6ea;--link:#215d7a;--max:980px}
    *{box-sizing:border-box} html{scroll-behavior:smooth}
    body{margin:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.65;font-size:17px;background:#fff}
    a{color:var(--link);text-decoration:none} a:hover{text-decoration:underline}
    .wrap{width:min(calc(100% - 40px),var(--max));margin:0 auto}
    header{padding:38px 0 20px;border-bottom:1px solid var(--line)}
    nav{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}.brand{font-weight:650;color:var(--text)}
    .nav-links{display:flex;gap:18px;flex-wrap:wrap}.nav-links a{color:var(--text)}
    .hero{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(230px,.75fr);gap:64px;align-items:center;padding:68px 0 56px}
    h1{margin:0;font-size:clamp(2.7rem,7vw,5.2rem);line-height:.98;letter-spacing:-.055em}
    .role{margin:18px 0 0;color:var(--muted);font-size:1.14rem}.intro{margin:26px 0 0;font-size:1.16rem}
    .hero-links{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
    .button{display:inline-block;padding:9px 14px;border:1px solid #cfd6dc;border-radius:8px;color:var(--text)}
    .button.primary{background:var(--text);border-color:var(--text);color:#fff}.button:hover{text-decoration:none}
    .photo{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 42%;border-radius:12px;display:block}
    section{padding:48px 0;border-top:1px solid var(--line)}
    .section-grid{display:grid;grid-template-columns:180px minmax(0,1fr);gap:34px}
    h2{margin:0;font-size:1.35rem;letter-spacing:-.025em} h3{margin:0 0 5px;font-size:1.03rem}
    p{margin:0 0 1em}.topics{display:grid;gap:22px}.topic p,.pub-meta{color:var(--muted)}
    .publication{padding:0 0 24px;margin:0 0 24px;border-bottom:1px solid var(--line)}
    .publication:last-child{border-bottom:0}.pub-title{font-weight:650;line-height:1.45}.pub-meta{margin-top:4px;font-size:.95rem}
    .pub-links{margin-top:7px;font-size:.95rem}.recognition{display:grid;gap:10px}.award{display:grid;grid-template-columns:58px 1fr;gap:16px}
    .year{color:var(--muted)}.contact-links{display:flex;flex-wrap:wrap;gap:9px 18px}
    footer{border-top:1px solid var(--line);padding:28px 0 48px;color:var(--muted);font-size:.9rem}
    @media(max-width:760px){.hero{grid-template-columns:1fr;gap:34px;padding-top:48px}.photo{width:min(78%,360px);order:-1}.section-grid{grid-template-columns:1fr;gap:16px}}
  </style>
</head>
<body>
<header><div class="wrap"><nav><a class="brand" href="#" id="brand"></a><div class="nav-links"><a href="#research">Research</a><a href="#publications">Publications</a><a href="#about">About</a><a href="#contact">Contact</a></div></nav></div></header>
<main class="wrap">
  <div class="hero">
    <div>
      <h1 id="name"></h1>
      <p class="role"><span id="position"></span> · <span id="institution"></span></p>
      <p class="intro" id="intro"></p>
      <div class="hero-links">
        <a class="button primary" id="cv" href="#">CV</a>
        <a class="button" id="scholar" href="#">Google Scholar</a>
        <a class="button" id="email" href="#">Email</a>
      </div>
    </div>
    <img class="photo" id="photo" alt="Portrait of Masahiro Suzuki">
  </div>

  <section id="research"><div class="section-grid"><h2>Research</h2><div class="topics" id="research-list"></div></div></section>
  <section id="publications"><div class="section-grid"><h2>Selected publications</h2><div><div id="publication-list"></div><p><a id="scholar-more" href="#">View all publications on Google Scholar →</a></p></div></div></section>
  <section id="about"><div class="section-grid"><h2>About</h2><div><div id="about-copy"></div><div class="recognition" id="award-list"></div></div></div></section>
  <section id="contact"><div class="section-grid"><h2>Contact</h2><div><p>For research-related inquiries, please feel free to get in touch.</p><div class="contact-links"><a id="contact-email"></a><a id="contact-scholar">Google Scholar</a><a id="contact-github">GitHub</a><a id="contact-cv">CV (PDF)</a></div></div></div></section>
</main>
<footer><div class="wrap">© 2026 <span id="footer-name"></span></div></footer>

<script>
fetch('data/site.json')
  .then(r => r.json())
  .then(d => {
    document.title = `${d.name} | Academic website`;
    const setText = (id, value) => document.getElementById(id).textContent = value || '';
    setText('brand', d.name); setText('name', d.name); setText('position', d.position);
    setText('institution', d.institution); setText('intro', d.intro); setText('footer-name', d.name);

    document.getElementById('photo').src = d.photo;
    document.getElementById('cv').href = d.cv;
    document.getElementById('scholar').href = d.google_scholar;
    document.getElementById('email').href = `mailto:${d.email}`;
    document.getElementById('scholar-more').href = d.google_scholar;
    document.getElementById('contact-email').href = `mailto:${d.email}`;
    document.getElementById('contact-email').textContent = d.email;
    document.getElementById('contact-scholar').href = d.google_scholar;
    document.getElementById('contact-github').href = d.github;
    document.getElementById('contact-cv').href = d.cv;

    document.getElementById('research-list').innerHTML = (d.research || []).map(x =>
      `<div class="topic"><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p></div>`
    ).join('');

    document.getElementById('publication-list').innerHTML = (d.publications || []).map(x =>
      `<article class="publication"><div class="pub-title">${esc(x.title)}</div>
       <div class="pub-meta">${esc(x.authors)} · ${esc(x.venue)} · ${esc(x.year)}</div>
       <div class="pub-links"><a href="${attr(x.url)}">Paper</a></div></article>`
    ).join('');

    document.getElementById('about-copy').innerHTML = (d.about || []).map(x => `<p>${esc(x)}</p>`).join('');
    document.getElementById('award-list').innerHTML = (d.awards || []).map(x =>
      `<div class="award"><span class="year">${esc(x.year)}</span><span>${esc(x.title)}</span></div>`
    ).join('');
  })
  .catch(err => {
    console.error(err);
    document.body.insertAdjacentHTML('beforeend','<p style="padding:20px">Could not load site content.</p>');
  });

function esc(s='') {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
function attr(s='') {
  return String(s).replace(/"/g, '&quot;');
}
</script>
</body>
</html>
