<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masahiro Suzuki | Climate Policy &amp; Energy Transitions | Chalmers</title>
<meta name="description" content="Masahiro Suzuki examines climate policy and energy transitions at Chalmers University of Technology.">
<style>
:root{--text:#20262d;--muted:#68737d;--line:#e5e8eb;--link:#225f7c;--max:980px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--text);font:17px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
.wrap{width:min(calc(100% - 40px),var(--max));margin:auto}
header{padding:36px 0 18px;border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}.brand{font-weight:650;color:var(--text)}
.nav{display:flex;gap:18px;flex-wrap:wrap;font-size:.94rem}.nav a{color:var(--text)}
.nav-controls{display:flex;align-items:center}.lang-switch{display:inline-flex;align-items:center;gap:6px;padding:4px;border:1px solid var(--line);border-radius:999px;background:#f7f8f9}
.lang-btn{appearance:none;border:0;background:transparent;color:var(--muted);padding:6px 10px;border-radius:999px;cursor:pointer;font:inherit;font-size:.82rem}.lang-btn.active{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06);font-weight:600}
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(230px,.7fr);gap:64px;align-items:center;padding:70px 0 58px}h1{font-size:clamp(2.2rem,5vw,4.2rem);line-height:1;letter-spacing:-.055em;margin:0}.role{color:var(--muted);font-size:1.13rem;margin:17px 0 0}.intro{font-size:1.14rem;margin:26px 0 0}.actions{display:flex;gap:11px;flex-wrap:wrap;margin-top:28px}.btn{border:1px solid #ced5da;border-radius:8px;padding:9px 14px;color:var(--text)}.btn.primary{background:var(--text);color:#fff;border-color:var(--text)}
.photo{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 42%;border-radius:10px}section{padding:46px 0;border-top:1px solid var(--line)}.grid{display:grid;grid-template-columns:170px 1fr;gap:38px}h2{margin:0;font-size:1.3rem;letter-spacing:-.02em}p{margin:0 0 1em}.items{display:grid;gap:24px}.paper{padding-bottom:24px;border-bottom:1px solid var(--line)}.paper:last-child{border-bottom:0}.paper-title{font-weight:650;line-height:1.45}.paper-title a{color:var(--text);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:.12em}.paper-meta{color:var(--muted);font-size:.95rem;margin-top:4px}.timeline{display:grid;gap:25px}.record{display:grid;grid-template-columns:110px 1fr;gap:18px;align-items:flex-start}.record-main{display:flex;flex-direction:column;gap:4px}.period{color:var(--muted);font-variant-numeric:tabular-nums;font-size:1.05rem}.record-title{font-weight:650;font-size:1.06rem;letter-spacing:-.015em}.record-meta{color:var(--muted);font-size:1.02rem}.award{display:grid;grid-template-columns:58px 1fr;gap:16px;margin:8px 0}.year{color:var(--muted)}.award a{color:var(--text);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:.12em}.contact{display:flex;gap:18px;flex-wrap:wrap}footer{border-top:1px solid var(--line);padding:28px 0 44px;color:var(--muted);font-size:.9rem}
@media(max-width:760px){.hero{grid-template-columns:1fr;gap:32px;padding-top:46px}.photo{width:min(78%,360px);order:-1}.grid{grid-template-columns:1fr;gap:15px}.record{grid-template-columns:1fr;gap:2px}nav{align-items:flex-start}.nav-controls{width:100%;justify-content:flex-end}}
</style>
</head>
<body>
<header><div class="wrap"><nav><div class="nav"><a href="#publications" id="nav-publications">Publications</a><a href="#employment" id="nav-employment">Employment</a><a href="#education" id="nav-education">Education</a><a href="#contact" id="nav-contact">Contact</a></div><div class="nav-controls"><div class="lang-switch" aria-label="Language selection"><button class="lang-btn active" data-lang="en">EN</button><button class="lang-btn" data-lang="ja">日本語</button></div></div></nav></div></header>
<main class="wrap">
<div class="hero"><div><h1 id="name"></h1><p class="role"><span id="position"></span> · <span id="institution"></span></p><p class="intro" id="intro"></p><div class="actions"><a class="btn primary" id="cv"></a><a class="btn" id="scholar"></a><a class="btn" id="email"></a></div></div><img class="photo" id="photo" alt=""></div>
<section id="publications"><div class="grid"><h2 id="publications-title">Selected publications</h2><div><div class="items" id="publication-list"></div><p><a id="all-pubs">View all publications on Google Scholar →</a></p></div></div></section>
<section id="employment"><div class="grid"><h2 id="employment-title">Employment</h2><div class="timeline" id="employment-list"></div></div></section>
<section id="education"><div class="grid"><h2 id="education-title">Education</h2><div class="timeline" id="education-list"></div></div></section>
<section id="awards"><div class="grid"><h2 id="awards-title">Selected awards</h2><div id="award-list"></div></div></section>
<section id="contact"><div class="grid"><h2 id="contact-title">Contact</h2><div class="contact"><a id="contact-email"></a><a id="contact-scholar">Google Scholar</a><a id="contact-cv">CV (PDF)</a></div></div></section>
</main>
<footer><div class="wrap"><span id="footer-year">© 2026</span> <span id="footer-name"></span></div></footer>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const translations={en:{nav:{publications:'Publications',employment:'Employment',education:'Education',contact:'Contact'},headings:{publications:'Selected publications',employment:'Employment',education:'Education',awards:'Selected awards',contact:'Contact'},actions:{cv:'CV',scholar:'Google Scholar',email:'Email me'},allPubs:'View all publications on Google Scholar →'},ja:{nav:{publications:'研究業績',employment:'職歴',education:'学歴',contact:'連絡先'},headings:{publications:'主な研究業績',employment:'職歴',education:'学歴',awards:'受賞歴',contact:'連絡先'},actions:{cv:'CV',scholar:'Google Scholar',email:'メール'},allPubs:'Google Scholarで全ての研究業績を見る →'}};
let currentLang='en';try{const saved=localStorage.getItem('lang');if(saved==='ja')currentLang='ja';}catch(e){}
let profile;let awardsData=[];
function localized(value,jaValue){return currentLang==='ja'?(jaValue||value):value}
function renderAward(x){const title=localized(x.title,x.title_ja);const parts=currentLang==='ja'?title.split(/：(.+)/):title.split(/,\s*(.+)/);const prize=esc(parts[0]);const linked=parts[1]||'';return `<div class="award"><span class="year">${esc(x.year)}</span><span>${x.url&&linked?`${prize}${currentLang==='ja'?'：':', '}<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(linked)}</a>`:esc(title)}</span></div>`}
function renderAwards(){document.getElementById('award-list').innerHTML=awardsData.map(renderAward).join('')}
function applyTranslations(lang){currentLang=lang;try{localStorage.setItem('lang',lang)}catch(e){}const t=translations[lang];document.documentElement.lang=lang==='ja'?'ja':'en';for(const[key,value]of Object.entries(t.nav))document.getElementById(`nav-${key}`).textContent=value;for(const[key,value]of Object.entries(t.headings))document.getElementById(`${key}-title`).textContent=value;document.getElementById('cv').textContent=t.actions.cv;document.getElementById('scholar').textContent=t.actions.scholar;document.getElementById('email').textContent=t.actions.email;document.getElementById('all-pubs').textContent=t.allPubs;document.querySelectorAll('.lang-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.lang===lang));if(profile){document.getElementById('name').textContent=localized(profile.name,profile.name_ja);document.getElementById('position').textContent=localized(profile.position,profile.position_ja);document.getElementById('institution').textContent=localized(profile.institution,profile.institution_ja);document.getElementById('intro').textContent=localized(profile.intro,profile.intro_ja);document.getElementById('footer-name').textContent=localized(profile.name,profile.name_ja);document.getElementById('contact-email').textContent=profile.email;document.getElementById('contact-email').href=`mailto:${profile.email}`;document.getElementById('contact-scholar').href=profile.google_scholar;document.getElementById('contact-cv').href=profile.cv;document.getElementById('cv').href=profile.cv;document.getElementById('scholar').href=profile.google_scholar;document.getElementById('email').href=`mailto:${profile.email}`;document.getElementById('all-pubs').href=profile.google_scholar;document.getElementById('photo').src=profile.photo;document.getElementById('photo').alt=localized(profile.name,profile.name_ja)}renderAwards()}
function renderRecord(x,titleKey){const title=localized(x[titleKey],x[titleKey+'_ja']);const institution=localized(x.institution,x.institution_ja);const location=x.location?` · ${esc(x.location)}`:'';return `<div class="record"><div class="period">${esc(x.period)}</div><div class="record-main"><div class="record-title">${esc(title)}</div><div class="record-meta">${esc(institution)}${location}</div></div></div>`}
Promise.all([fetch('data/profile.json').then(r=>r.json()),fetch('data/publications.json').then(r=>r.json()),fetch('data/employment.json').then(r=>r.json()),fetch('data/education.json').then(r=>r.json()),fetch('data/awards.json').then(r=>r.json())]).then(([p,pubs,employment,education,awards])=>{profile=p;awardsData=awards;document.getElementById('publication-list').innerHTML=pubs.slice(0,5).map(x=>{const url=x.url||'#';const title=localized(x.title,x.title_ja);const authors=localized(x.authors||'',x.authors_ja);const venue=localized(x.venue||'',x.venue_ja);return `<article class="paper"><div class="paper-title"><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(title)}</a></div><div class="paper-meta">${esc([authors,venue,x.year||''].filter(Boolean).join(' · '))}</div></article>`}).join('');document.getElementById('employment-list').innerHTML=employment.map(x=>renderRecord(x,'role')).join('');document.getElementById('education-list').innerHTML=education.map(x=>renderRecord(x,'degree')).join('');applyTranslations(currentLang)}).catch(err=>console.error(err));
document.querySelectorAll('.lang-btn').forEach(btn=>btn.addEventListener('click',()=>applyTranslations(btn.dataset.lang)));applyTranslations(currentLang);
</script>
</body>
</html>
