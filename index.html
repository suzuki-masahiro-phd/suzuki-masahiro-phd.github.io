<style>
:root{--text:#20262d;--muted:#68737d;--line:#e5e8eb;--link:#225f7c;--max:980px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--text);font:17px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}a:focus-visible,button:focus-visible{outline:2px solid var(--link);outline-offset:3px}
.wrap{width:min(calc(100% - 40px),var(--max));margin:auto}
header{padding:34px 0 18px;border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}.nav{display:flex;align-items:center;gap:18px;flex-wrap:wrap;font-size:.94rem}.nav a{color:var(--text)}.home-logo{display:inline-flex;align-items:center;justify-content:center;width:64px;height:56px;margin-right:6px;flex:0 0 auto}.home-logo img{display:block;width:100%;height:100%;object-fit:contain}.home-logo:hover{text-decoration:none}
.nav-controls{display:flex;align-items:center}.lang-switch{display:inline-flex;align-items:center;gap:6px;padding:4px;border:1px solid var(--line);border-radius:999px;background:#f7f8f9}
.lang-btn{appearance:none;border:0;background:transparent;color:var(--muted);padding:6px 10px;border-radius:999px;cursor:pointer;font:inherit;font-size:.82rem}.lang-btn.active{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06);font-weight:600}
.hero{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(220px,.65fr);gap:68px;align-items:center;padding:68px 0 56px}h1{font-size:clamp(2.2rem,5vw,4.2rem);line-height:1;letter-spacing:-.055em;margin:0}.role{color:var(--muted);font-size:1.1rem;margin:17px 0 0}.intro{font-size:1.12rem;max-width:670px;margin:25px 0 0}.actions{display:flex;gap:11px;flex-wrap:wrap;align-items:center;margin-top:27px}.btn{border:1px solid #ced5da;border-radius:12px;padding:9px 14px;color:var(--text);display:inline-flex;align-items:center;justify-content:center;min-height:60px}.btn.primary{background:var(--text);color:#fff;border-color:var(--text);min-width:74px}.icon-btn{width:60px;min-width:60px;padding:0;background:#fff}.icon-btn svg{width:28px;height:28px;display:block}.icon-btn.scholar svg{width:32px;height:32px}.icon-btn.linkedin img{width:30px;height:30px;display:block;border-radius:5px}.icon-btn.email{color:var(--text)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.photo{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 42%;border-radius:10px}section{padding:44px 0;border-top:1px solid var(--line)}.grid{display:grid;grid-template-columns:170px 1fr;gap:38px}h2{margin:0;font-size:1.3rem;letter-spacing:-.02em}p{margin:0 0 1em}.items{display:grid;gap:24px}.paper{padding-bottom:24px;border-bottom:1px solid var(--line)}.paper:last-child{border-bottom:0}.paper-with-figure{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}.paper-title{font-weight:650;line-height:1.45}.paper-title a{color:var(--text);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:.12em}.paper-meta{color:var(--muted);font-size:.95rem;margin-top:4px}.paper-meta strong{color:var(--text);font-weight:650}.paper-kind{display:inline-block;margin-top:7px;color:var(--muted);font-size:.8rem;letter-spacing:.02em;text-transform:uppercase}.paper-visual{min-width:0}.paper-figure{display:block;width:auto;height:auto;max-width:100%;max-height:220px;object-fit:contain;object-position:left top;margin:0}.paper-caption{color:var(--muted);font-size:.84rem;margin-top:7px}
.figure-link{display:inline-block;cursor:zoom-in}.figure-link:focus-visible{outline:2px solid var(--text);outline-offset:4px;border-radius:4px}.figure-dialog{width:min(94vw,1400px);max-width:none;max-height:94vh;padding:0;border:0;border-radius:10px;background:#fff;box-shadow:0 20px 70px rgba(0,0,0,.28);overflow:visible}.figure-dialog::backdrop{background:rgba(0,0,0,.72)}.figure-dialog img{display:block;max-width:94vw;max-height:90vh;width:auto;height:auto;margin:auto;border-radius:8px}.figure-dialog-close{position:absolute;right:-12px;top:-12px;width:36px;height:36px;border:0;border-radius:50%;background:var(--text);color:#fff;font:inherit;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.timeline{display:grid;gap:25px}.record{display:grid;grid-template-columns:110px 1fr;gap:18px;align-items:flex-start}.record-main{display:flex;flex-direction:column;gap:4px}.period{color:var(--muted);font-variant-numeric:tabular-nums;font-size:1.05rem}.record-title{font-weight:650;font-size:1.06rem;letter-spacing:-.015em}.record-meta{color:var(--muted);font-size:1.02rem}.record-details{color:var(--muted);font-size:.94rem;margin-top:3px;max-width:720px}
.award{display:grid;grid-template-columns:58px 1fr;gap:16px;margin:8px 0}.year{color:var(--muted)}.award a{color:var(--text);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:.12em}.contact{display:flex;gap:18px;flex-wrap:wrap}footer{border-top:1px solid var(--line);padding:28px 0 44px;color:var(--muted);font-size:.9rem}.load-error{padding:18px 0;color:var(--muted)}
@media(max-width:760px){.hero{grid-template-columns:1fr;gap:32px;padding-top:46px}.photo{width:min(78%,360px);order:-1}.grid{grid-template-columns:1fr;gap:15px}.paper-with-figure{grid-template-columns:1fr;gap:14px}.paper-figure{max-width:min(100%,320px);max-height:260px}.record{grid-template-columns:1fr;gap:2px}nav{align-items:flex-start}.nav{gap:14px}.home-logo{width:54px;height:48px;margin-right:3px}.nav-controls{width:100%;justify-content:flex-end}.icon-btn{width:54px;min-width:54px;min-height:54px}.icon-btn.scholar svg{width:28px;height:28px}.icon-btn.linkedin img{width:26px;height:26px}.icon-btn.email svg{width:24px;height:24px}}
</style>

<body>
<header><div class="wrap"><nav aria-label="Primary"><div class="nav"><a class="home-logo" href="#" aria-label="Home"><img src="/media/images/site-logo-cropped.png" alt="" aria-hidden="true"></a><a href="#publications" id="nav-publications">Publications</a><a href="#employment" id="nav-employment">Employment</a><a href="#education" id="nav-education">Education</a><a href="#awards" id="nav-awards">Awards</a><a href="#contact" id="nav-contact">Contact</a></div><div class="nav-controls"><div class="lang-switch" role="group" aria-label="Language selection"><button class="lang-btn active" data-lang="en" aria-pressed="true">EN</button><button class="lang-btn" data-lang="ja" aria-pressed="false">日本語</button></div></div></nav></div></header>
<main class="wrap">
<div class="hero"><div><h1 id="name"></h1><p class="role"><a id="chalmers-profile"><span id="position"></span> · <span id="institution"></span></a><span id="group-wrap" hidden> · <a id="group"></a></span></p><p class="intro" id="intro"></p><div class="actions"><a class="btn primary" id="cv"></a><a class="btn icon-btn scholar" id="scholar" aria-label="Google Scholar" title="Google Scholar"><svg viewBox="0 0 64 64" aria-hidden="true"><path fill="#4285F4" d="M32 8 6 21l26 13 21.26-10.63V40H58V21L32 8Z"/><path fill="#7BAAF7" d="M15 27.5V36c0 6.08 7.61 11 17 11s17-4.92 17-11v-8.5L32 36 15 27.5Z"/><path fill="#AECBFA" d="M16 37.2C18.2 42.5 24.5 46 32 46s13.8-3.5 16-8.8V36c0 6.08-7.16 11-16 11s-16-4.92-16-11v1.2Z"/></svg><span class="sr-only">Google Scholar</span></a><a class="btn icon-btn linkedin" id="linkedin" aria-label="LinkedIn" title="LinkedIn"><img src="/media/images/linkedin-logo.png" alt="" aria-hidden="true"><span class="sr-only">LinkedIn</span></a><a class="btn icon-btn email" id="email" aria-label="Email" title="Email"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 6.5h16A1.5 1.5 0 0 1 21.5 8v8A1.5 1.5 0 0 1 20 17.5H4A1.5 1.5 0 0 1 2.5 16V8A1.5 1.5 0 0 1 4 6.5Zm0 1 8 6 8-6"/></svg><span class="sr-only">Email</span></a></div></div><img class="photo" id="photo" alt=""></div>
<section id="publications"><div class="grid"><h2 id="publications-title">Selected publications</h2><div><div class="items" id="publication-list"></div><p><a id="all-pubs">View all publications on Google Scholar →</a></p></div></div></section>
<section id="employment"><div class="grid"><h2 id="employment-title">Employment</h2><div class="timeline" id="employment-list"></div></div></section>
<section id="education"><div class="grid"><h2 id="education-title">Education</h2><div class="timeline" id="education-list"></div></div></section>
<section id="awards"><div class="grid"><h2 id="awards-title">Selected awards</h2><div id="award-list"></div></div></section>
<section id="contact"><div class="grid"><h2 id="contact-title">Contact</h2><div class="contact"><a id="contact-email"></a><a id="contact-linkedin">LinkedIn</a><a id="contact-group" target="_blank" rel="noopener noreferrer">ENTAP</a></div></div></section>

</main>
<footer><div class="wrap"><span id="footer-year">© 2026</span> <span id="footer-name"></span></div></footer>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const translations={
  en:{nav:{publications:'Publications',employment:'Employment',education:'Education',awards:'Awards',contact:'Contact'},headings:{publications:'Selected publications',employment:'Employment',education:'Education',awards:'Selected awards',contact:'Contact'},actions:{cv:'CV',scholar:'Google Scholar',linkedin:'LinkedIn',email:'Email me'},allPubs:'View all publications on Google Scholar →',loadError:'Some site content could not be loaded. Please refresh the page.'},
  ja:{nav:{publications:'研究業績',employment:'職歴',education:'学歴',awards:'受賞歴',contact:'連絡先'},headings:{publications:'主な研究業績',employment:'職歴',education:'学歴',awards:'主な受賞歴',contact:'連絡先'},actions:{cv:'CV',scholar:'Google Scholar',linkedin:'LinkedIn',email:'メール'},allPubs:'Google Scholarで全ての研究業績を見る →',loadError:'一部のコンテンツを読み込めませんでした。ページを再読み込みしてください。'}
};
let currentLang='en';try{const saved=localStorage.getItem('lang');if(saved==='en'||saved==='ja'){currentLang=saved}else{const langs=(navigator.languages||[navigator.language||'']).map(x=>String(x).toLowerCase());const timeZone=Intl.DateTimeFormat().resolvedOptions().timeZone;const japanLocale=langs.some(x=>x==='ja'||x.startsWith('ja-'));const japanTimeZone=timeZone==='Asia/Tokyo';if(japanLocale||japanTimeZone)currentLang='ja'}}catch(e){const lang=String(navigator.language||'').toLowerCase();if(lang==='ja'||lang.startsWith('ja-'))currentLang='ja'}
let profile,pubsData=[],employmentData=[],educationData=[],awardsData=[];
function localized(value,jaValue){return currentLang==='ja'?(jaValue||value):value}
function emphasizeName(authors){const safe=esc(authors);return safe.replace(/Suzuki, M\./g,'<strong>Suzuki, M.</strong>')}
function renderAward(x){const title=localized(x.title,x.title_ja);const parts=currentLang==='ja'?title.split(/：(.+)/):title.split(/,\s*(.+)/);const prize=esc(parts[0]);const linked=parts[1]||'';return `<div class="award"><span class="year">${esc(x.year)}</span><span>${x.url&&linked?`${prize}${currentLang==='ja'?'：':', '}<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(linked)}</a>`:esc(title)}</span></div>`}
function renderAwards(){document.getElementById('award-list').innerHTML=awardsData.map(renderAward).join('')}
function renderPublications(){document.getElementById('publication-list').innerHTML=pubsData.slice(0,5).map(x=>{const url=x.url||'#';const title=localized(x.title,x.title_ja);const authors=localized(x.authors||'',x.authors_ja);const venue=localized(x.venue||'',x.venue_ja);const kind=localized(x.kind||'',x.kind_ja);const figure=x.figure?`<div class="paper-visual"><a class="figure-link" href="${esc(x.figure)}" data-figure-src="${esc(x.figure)}" data-figure-alt="${esc(localized(x.figure_alt||'',x.figure_alt_ja||''))}" aria-label="Enlarge figure"><img class="paper-figure" src="${esc(x.figure)}" alt="${esc(localized(x.figure_alt||'',x.figure_alt_ja||''))}" loading="lazy"></a>${x.figure_caption?`<div class="paper-caption">${esc(localized(x.figure_caption,x.figure_caption_ja))}</div>`:''}</div>`:'';const copy=`<div class="paper-copy"><div class="paper-title"><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(title)}</a></div><div class="paper-meta">${emphasizeName(authors)}${authors&&venue?' · ':''}${esc(venue)}${(authors||venue)&&x.year?' · ':''}${esc(x.year||'')}</div>${kind?`<div class="paper-kind">${esc(kind)}</div>`:''}</div>`;return `<article class="paper${x.figure?' paper-with-figure':''}">${figure}${copy}</article>`}).join('')}
function renderRecord(x,titleKey,showDetails=false){const title=localized(x[titleKey],x[titleKey+'_ja']);const institution=localized(x.institution,x.institution_ja);const location=localized(x.location||'',x.location_ja||'');const details=showDetails?localized(x.details||'',x.details_ja||''):'';return `<div class="record"><div class="period">${esc(x.period)}</div><div class="record-main"><div class="record-title">${esc(title)}</div><div class="record-meta">${esc(institution)}${location?` · ${esc(location)}`:''}</div>${details?`<div class="record-details">${esc(details)}</div>`:''}</div></div>`}
function renderRecords(){document.getElementById('employment-list').innerHTML=employmentData.map(x=>renderRecord(x,'role',false)).join('');document.getElementById('education-list').innerHTML=educationData.map(x=>renderRecord(x,'degree',true)).join('')}
function applyTranslations(lang){currentLang=lang;try{localStorage.setItem('lang',lang)}catch(e){}const t=translations[lang];document.documentElement.lang=lang==='ja'?'ja':'en';for(const[key,value]of Object.entries(t.nav))document.getElementById(`nav-${key}`).textContent=value;for(const[key,value]of Object.entries(t.headings))document.getElementById(`${key}-title`).textContent=value;document.getElementById('cv').textContent=t.actions.cv;document.getElementById('scholar').setAttribute('aria-label',t.actions.scholar);document.getElementById('scholar').title=t.actions.scholar;document.getElementById('linkedin').setAttribute('aria-label',t.actions.linkedin);document.getElementById('linkedin').title=t.actions.linkedin;document.getElementById('email').setAttribute('aria-label',t.actions.email);document.getElementById('email').title=t.actions.email;document.getElementById('all-pubs').textContent=t.allPubs;document.querySelectorAll('.lang-btn').forEach(btn=>{const active=btn.dataset.lang===lang;btn.classList.toggle('active',active);btn.setAttribute('aria-pressed',String(active))});if(profile){document.getElementById('name').textContent=localized(profile.name,profile.name_ja);document.getElementById('position').textContent=localized(profile.position,profile.position_ja);document.getElementById('institution').textContent=localized(profile.institution,profile.institution_ja);const chalmersProfile=document.getElementById('chalmers-profile');chalmersProfile.href=profile.chalmers_profile||'https://www.chalmers.se/personer/suzukim/';chalmersProfile.target='_blank';chalmersProfile.rel='noopener noreferrer';document.getElementById('intro').textContent=localized(profile.intro,profile.intro_ja);document.getElementById('footer-name').textContent=localized(profile.name,profile.name_ja);document.getElementById('contact-email').textContent=profile.email;document.getElementById('contact-email').href=`mailto:${profile.email}`;document.getElementById('contact-linkedin').href=profile.linkedin;document.getElementById('contact-linkedin').target='_blank';document.getElementById('contact-linkedin').rel='noopener noreferrer';document.getElementById('cv').href=profile.cv;document.querySelector('#scholar .sr-only').textContent=t.actions.scholar;document.querySelector('#linkedin .sr-only').textContent=t.actions.linkedin;document.querySelector('#email .sr-only').textContent=t.actions.email;document.getElementById('scholar').href=profile.google_scholar;document.getElementById('scholar').target='_blank';document.getElementById('scholar').rel='noopener noreferrer';document.getElementById('linkedin').href=profile.linkedin;document.getElementById('linkedin').target='_blank';document.getElementById('linkedin').rel='noopener noreferrer';document.getElementById('email').href=`mailto:${profile.email}`;document.getElementById('all-pubs').href=profile.google_scholar;document.getElementById('all-pubs').target='_blank';document.getElementById('all-pubs').rel='noopener noreferrer';if(profile.group&&profile.group_url){document.getElementById('group').textContent=localized(profile.group,profile.group_ja);document.getElementById('group').href=profile.group_url;document.getElementById('group').target='_blank';document.getElementById('group').rel='noopener noreferrer';document.getElementById('group-wrap').hidden=false;document.getElementById('contact-group').href=profile.group_url}else{document.getElementById('group-wrap').hidden=true;document.getElementById('contact-group').hidden=true}document.getElementById('photo').src=profile.photo;document.getElementById('photo').alt=localized(profile.photo_alt||profile.name,profile.photo_alt_ja||profile.name_ja)}renderPublications();renderRecords();renderAwards()}
async function getJSON(path){const r=await fetch(path);if(!r.ok)throw new Error(`${path}: ${r.status}`);return r.json()}
Promise.all([getJSON('data/profile.json'),getJSON('data/publications.json'),getJSON('data/employment.json'),getJSON('data/education.json'),getJSON('data/awards.json')]).then(([p,pubs,employment,education,awards])=>{profile=p;pubsData=pubs;employmentData=employment;educationData=education;awardsData=awards;applyTranslations(currentLang)}).catch(err=>{console.error(err);const box=document.getElementById('load-error');box.textContent=translations[currentLang].loadError;box.hidden=false});
const figureDialog=document.getElementById('figure-dialog');const figureDialogImage=document.getElementById('figure-dialog-image');document.getElementById('publication-list').addEventListener('click',e=>{const link=e.target.closest('.figure-link');if(!link)return;if(typeof figureDialog.showModal!=='function')return;e.preventDefault();figureDialogImage.src=link.dataset.figureSrc;figureDialogImage.alt=link.dataset.figureAlt||'';figureDialog.showModal()});function closeFigure(){figureDialog.close();figureDialogImage.src=''}document.getElementById('figure-dialog-close').addEventListener('click',closeFigure);figureDialog.addEventListener('click',e=>{if(e.target===figureDialog)closeFigure()});figureDialog.addEventListener('cancel',()=>{figureDialogImage.src=''});
document.querySelectorAll('.lang-btn').forEach(btn=>btn.addEventListener('click',()=>applyTranslations(btn.dataset.lang)));applyTranslations(currentLang);
</script>
</body>
