media:
  - name: images
    label: Photos
    input: media/images
    output: /media/images
    categories: [image]

  - name: documents
    label: Documents
    input: media/docs
    output: /media/docs
    categories: [document]

content:
  - name: introduction
    label: Introduction
    type: file
    path: data/profile.json
    format: json
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: position
        label: Position
        type: string
        required: true
      - name: institution
        label: Institution
        type: string
        required: true
      - name: intro
        label: Introduction / short bio
        type: text
        required: true
        description: This is your main biography at the top of the page.
      - name: photo
        label: Profile photo
        type: image
        options:
          media: images
      - name: cv
        label: CV
        type: file
        options:
          media: documents
          extensions: [pdf]
      - name: email
        label: Email
        type: string
      - name: google_scholar
        label: Google Scholar
        type: string

  - name: publications
    label: Publications
    type: file
    path: data/publications.json
    format: json
    list: true
    fields:
      - name: title
        label: Title
        type: text
        required: true
      - name: authors
        label: Authors
        type: text
      - name: venue
        label: Journal / venue
        type: string
      - name: year
        label: Year
        type: string
      - name: url
        label: Link
        type: string
      - name: link_label
        label: Link label
        type: string

  - name: employment
    label: Employment
    type: file
    path: data/employment.json
    format: json
    list: true
    fields:
      - name: period
        label: Period
        type: string
      - name: role
        label: Position
        type: string
      - name: institution
        label: Institution
        type: string
      - name: location
        label: Location
        type: string
      - name: description
        label: Description
        type: text

  - name: education
    label: Education
    type: file
    path: data/education.json
    format: json
    list: true
    fields:
      - name: period
        label: Period
        type: string
      - name: degree
        label: Degree
        type: string
      - name: institution
        label: Institution
        type: text
      - name: location
        label: Location
        type: string
      - name: details
        label: Details
        type: text

  - name: awards
    label: Awards
    type: file
    path: data/awards.json
    format: json
    list: true
    fields:
      - name: year
        label: Year
        type: string
      - name: title
        label: Award
        type: string
